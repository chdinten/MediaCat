minimum_pre_commit_version: "3.7.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^mediacat/design/  # logo sources (design/logos/README.md)
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        # --unsafe: syntax check only; mkdocs.yml uses !!python/name tags (mermaid fences)
        args: [--allow-multiple-documents, --unsafe]
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
        exclude: ^mediacat/src/mediacat/web/static/streaming/  # official logos, byte-identical to the brand downloads
      - id: trailing-whitespace
        exclude: ^mediacat/src/mediacat/web/static/streaming/  # official logos, byte-identical to the brand downloads
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.bat$  # cmd.exe needs CRLF (see /.gitattributes)
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11  # keep in step with the venv's ruff (make lint)
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy and bandit run from the project venv (make setup) so they see the
  # app's dependencies and config; paths are relative to the repo root.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (make typecheck)
        entry: bash -c 'cd mediacat && .venv/bin/mypy src'
        language: system
        pass_filenames: false
        files: ^mediacat/src/.*\.py$
      - id: bandit
        name: bandit (make security)
        entry: bash -c 'cd mediacat && .venv/bin/bandit -q -c pyproject.toml -r src'
        language: system
        pass_filenames: false
        files: ^mediacat/src/.*\.py$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3013, --ignore, DL3059]
